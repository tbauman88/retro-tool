name: API
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TOKEN_SECRET: randomSecret123
      GITHUB_CLIENT_ID: randomClientId
      GITHUB_CLIENT_SECRET: randomClientSecret
      GITHUB_CALLBACK_URL: http://localhost:3333/auth/github/callback
      SPA_URL: http://localhost:4200
      COOKIE_DOMAIN: localhost
      NX_API_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
      - name: Generate Prisma Client
        run: yarn prisma generate
      - name: Check Lint
        run: yarn lint api
      - name: Test
        env:
          TEST_DATABASE_URL: 'postgresql://user:password@localhost:5432/database?schema=public'
        run: yarn test:api --codeCoverage --verbose
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: api
          files: ./coverage/apps/api/lcov.info
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: user
          POSTGRES_DB: database
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
