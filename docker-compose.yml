services:
  db:
    image: postgres:13
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: database
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    networks:
      - retro-tool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d database"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:13
    ports:
      - 5434:5432
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: database
    volumes:
      - 'postgres_test_data:/var/lib/postgresql/data'
    networks:
      - retro-tool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d database"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
    networks:
      - retro-tool

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/database?schema=public
    networks:
      - retro-tool

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3333:3333
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/database?schema=public
      APP_PORT: 3333
      NODE_ENV: production
      TOKEN_SECRET: ${TOKEN_SECRET:-randomSecret123}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost/api/auth/github/callback}
      SPA_URL: ${SPA_URL:-http://localhost}
      USE_MOCK_AUTH: ${USE_MOCK_AUTH:-false}
      REDIS_CONNECTION_STRING: redis://redis:6379
    networks:
      - retro-tool

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        NX_API_URL: ${NX_API_URL:-http://localhost/api}
    ports:
      - 80:80
    depends_on:
      - api
    networks:
      - retro-tool

networks:
  retro-tool:

volumes:
  redisdata:
    driver: local
  postgres_data:
    driver: local
  postgres_test_data:
    driver: local
