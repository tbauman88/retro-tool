services:
  db:
    image: postgres:13
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: database
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    networks:
      - retro-tool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d database"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:13
    ports:
      - 5434:5432
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: database
    volumes:
      - 'postgres_test_data:/var/lib/postgresql/data'
    networks:
      - retro-tool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d database"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
    networks:
      - retro-tool

  migrations:
    image: node:20
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/database?schema=public
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "yarn install && npx prisma generate && npx prisma migrate deploy"
    networks:
      - retro-tool

  api:
    image: node:20
    working_dir: /app
    ports:
      - 3333:3333
      - 9229:9229
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/database?schema=public
      TEST_DATABASE_URL: postgresql://user:password@db_test:5432/database?schema=public
      APP_PORT: 3333
      DEBUG_PORT: 9229
      NODE_ENV: development
      TOKEN_SECRET: ${TOKEN_SECRET:-randomSecret123}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3333/auth/github/callback}
      SPA_URL: ${SPA_URL:-http://localhost:4200}
      USE_MOCK_AUTH: ${USE_MOCK_AUTH:-true}
      REDIS_CONNECTION_STRING: redis://redis:6379
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "yarn install && npx nx serve api"
    networks:
      - retro-tool

  client:
    image: node:20
    working_dir: /app
    ports:
      - 4200:4200
    depends_on:
      - api
    environment:
      NX_API_URL: http://localhost:3333
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "yarn install && npx nx serve client --host 0.0.0.0"
    networks:
      - retro-tool

networks:
  retro-tool:

volumes:
  redisdata:
    driver: local
  postgres_data:
    driver: local
  postgres_test_data:
    driver: local
  node_modules:
    driver: local
